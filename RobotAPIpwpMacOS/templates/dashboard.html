<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Dashboard</title>
    <style>
        /* Global styles - Dark theme setup */
        body {
            background-color: #1e1e1e;  /* Dark background for better contrast */
            color: #ffffff;             /* Light text for readability */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Grid layout for main dashboard components */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;    /* Two equal columns */
            grid-template-rows: 1fr 1fr;       /* Two equal rows */
            gap: 20px;                         /* Space between grid items */
            height: calc(100vh - 100px);       /* Full viewport height minus margins */
        }

        /* Common panel styling */
        .panel {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ddd;
        }

        /* Video panel specific styles */
        .video-panel {
            overflow: hidden;
            grid-column: 1;                    /* Takes first column */
            grid-row: 1 / span 2;              /* Spans both rows */
        }

        /* Container for video streams */
        .stream-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 20px;
        }

        /* Individual video stream box */
        .stream-box {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Stream titles */
        .stream-box h3 {
            margin-bottom: 10px;
            color: #4caf50;                    /* Green color for headers */
        }

        /* Video stream styling */
        .stream-box img {
            width: 100%;
            height: calc(100% - 40px);
            object-fit: contain;
            border: 2px solid #555;
            border-radius: 4px;
        }

        /* Control buttons grid layout */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
        }

        /* Common button styles */
        .control-grid button {
            width: 80px;
            height: 80px;
            font-size: 24px;
            color: #ffffff;
            background-color: #555;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        /* Button hover effect */
        .control-grid button:hover {
            background-color: #666;
        }

        /* Button positioning in grid */
        .forward { grid-column: 2; grid-row: 1; }          /* Up arrow */
        .backward { grid-column: 2; grid-row: 3; }         /* Down arrow */
        .left { grid-column: 1; grid-row: 2; }            /* Left arrow */
        .right { grid-column: 3; grid-row: 2; }           /* Right arrow */
        .start { grid-column: 1; grid-row: 1; background-color: #2e7d32 !important; }  /* Green start button */
        .stop { grid-column: 3; grid-row: 1; background-color: #c62828 !important; }   /* Red stop button */

        /* Log panel styling */
        .log-panel {
            max-height: 200px;
            overflow-y: auto;                  /* Scrollable logs */
            width: 45%;
            padding: 10px;
            background-color: #444;
            border-radius: 4px;
            margin: 0 10px;
        }

        /* Log panel header */
        .log-panel h3 {
            margin-top: 0;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #555;
            color: #4caf50;
        }

        /* Log list styling */
        .log-panel ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* Individual log entry */
        .log-panel li {
            padding: 5px 10px;
            border-bottom: 1px solid #555;
            font-size: 14px;
            transition: background-color 1s;
        }

        /* Welcome message styling */
        h2 {
            margin-bottom: 20px;
            color: #4caf50;
        }
    </style>
</head>
<body>
    <!-- Welcome header with dynamic username -->
    <h2>Welcome, {{ username }}</h2>

    <!-- Main dashboard container -->
    <div class="grid-container">
        <!-- Video streams panel -->
        <div class="panel video-panel">
            <div class="stream-container">
                <!-- Processed video stream with lane detection -->
                <div class="stream-box">
                    <h3>Lane Detection Stream</h3>
                    <img id="overlay-stream" src="http://192.168.240.22:5001/video_feed/overlay" alt="Lane Detection Stream Unavailable" />
                </div>
                <!-- Raw video stream -->
                <div class="stream-box">
                    <h3>Raw Video Stream</h3>
                    <img id="raw-stream" src="http://192.168.240.22:5001/video_feed/raw" alt="Raw Stream Unavailable" />
                </div>
            </div>
        </div>
        
        <!-- Robot control panel -->
        <div class="panel robot-control">
            <h3>Robot Control</h3>
            <div class="control-grid">
                <!-- Control buttons with mouse events -->
                <button class="forward" onmousedown="sendCommand('forward')" onmouseup="sendCommand('stop')">↑</button>
                <button class="left" onmousedown="sendCommand('left')" onmouseup="sendCommand('stop')">←</button>
                <button class="right" onmousedown="sendCommand('right')" onmouseup="sendCommand('stop')">→</button>
                <button class="backward" onmousedown="sendCommand('backward')" onmouseup="sendCommand('stop')">↓</button>
                <button class="stop" onclick="startRobot('exit')">Stop</button>
                <button class="start" onclick="startRobot('start')">Start</button>
            </div>
        </div>
        
        <!-- Logs display panel -->
        <div class="panel logs-panel">
            <!-- Command history log -->
            <div class="log-panel">
                <h3>Command Log</h3>
                <ul id="command-log-list"></ul>
            </div>
            <!-- Login history log -->
            <div class="log-panel">
                <h3>Login Log</h3>
                <ul id="login-log-list"></ul>
            </div>
        </div>
    </div>

    <script>
        /**
         * LogManager class handles all logging functionality
         * Manages both command and login logs
         */
        class LogManager {
            constructor() {
                // Initialize DOM elements and settings
                this.commandLogList = document.getElementById('command-log-list');
                this.loginLogList = document.getElementById('login-log-list');
                this.maxLogItems = 50;  // Maximum number of log entries to display
                this.setupEventSource();
                this.loadInitialLogs();
            }

            /**
             * Loads existing logs from server when page loads
             */
            async loadInitialLogs() {
                try {
                    // Fetch both types of logs simultaneously
                    const [logsResponse, loginLogsResponse] = await Promise.all([
                        fetch('/get-logs'),
                        fetch('/get-login-logs')
                    ]);

                    if (!logsResponse.ok || !loginLogsResponse.ok) {
                        throw new Error('Failed to fetch logs');
                    }

                    const logsData = await logsResponse.json();
                    const loginLogsData = await loginLogsResponse.json();

                    // Clear existing logs
                    this.commandLogList.innerHTML = '';
                    this.loginLogList.innerHTML = '';

                    // Populate command logs
                    logsData.logs.forEach(log => {
                        const li = document.createElement('li');
                        li.textContent = log;
                        this.commandLogList.appendChild(li);
                    });

                    // Populate login logs
                    loginLogsData.logs.forEach(log => {
                        const li = document.createElement('li');
                        li.textContent = log;
                        this.loginLogList.appendChild(li);
                    });
                } catch (error) {
                    console.error('Error loading initial logs:', error);
                }
            }

            /**
             * Sets up Server-Sent Events for real-time log updates
             */
            setupEventSource() {
                const eventSource = new EventSource('/events');

                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    this.addLog(data.type, data.message);
                };
            }

            /**
             * Adds a new log entry to the appropriate log panel
             */
            addLog(type, message) {
                const logList = type === 'command' ? this.commandLogList : this.loginLogList;
                const li = document.createElement('li');
                li.textContent = message;

                // Remove oldest log if maximum is reached
                if (logList.children.length >= this.maxLogItems) {
                    logList.removeChild(logList.firstChild);
                }

                logList.appendChild(li);
            }
        }

        // Initialize log manager
        const logManager = new LogManager();

        /**
         * Sends control commands to the robot
         */
        function sendCommand(action) {
            fetch('/send-command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: action })
            }).catch(error => console.error('Error sending command:', error));
        }

        /**
         * Starts or stops the robot system
         */
        function startRobot(action) {
            fetch('/start-robot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            }).catch(error => console.error('Error starting robot:', error));
        }

        // Keyboard control event listeners
        window.addEventListener('keydown', (event) => {
            // Map arrow keys to robot commands
            if (event.key === 'ArrowUp') {
                sendCommand('forward');
            } else if (event.key === 'ArrowDown') {
                sendCommand('backward');
            } else if (event.key === 'ArrowLeft') {
                sendCommand('left');
            } else if (event.key === 'ArrowRight') {
                sendCommand('right');
            }
        });

        // Stop robot when key is released
        window.addEventListener('keyup', (event) => {
            sendCommand('stop');
        });
    </script>
</body>
</html>
