<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robot Control Dashboard</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: 100vh;
        }
        .panel {
            border: 1px solid #ddd;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .robot-control h3, .login-log h3, .command-log h3 {
            margin-bottom: 10px;
        }
        .robot-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 5px;
        }
        .control-grid button {
            width: 80px;
            height: 80px;
            font-size: 12px;
            background-color: #87CEFA;
            border: none;
            cursor: pointer;
        }
        .forward { grid-column: 2; grid-row: 1; }
        .backward { grid-column: 2; grid-row: 3; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .fine-tune-left { grid-column: 1; grid-row: 1; }
        .fine-tune-right { grid-column: 3; grid-row: 1; }
        .stop { grid-column: 2; grid-row: 2; background-color: #FF6347; } /* Red color for Stop button */
        .start { grid-column: 2; grid-row: 4; background-color: #008000; }
    </style>
</head>
<body>
    <h2>Welcome, {{ username }}</h2>
    <div class="grid-container">
        <div class="panel left-panel">
            <h3>Additional Panel 1</h3>
            <!-- Content for left panel 1 -->
        </div>
        <div class="panel left-panel">
            <h3>Additional Panel 2</h3>
            <!-- Content for left panel 2 -->
        </div>
        
        <div class="panel robot-control">
            <h3>Robot Control</h3>
            <div class="control-grid">1
                <button class="fine-tune-left" onclick="startRobot('exit')">Stop</button>
                <button class="forward" onclick="sendCommand('forward')">Forward</button>
                <button class="fine-tune-right" onclick="startRobot('start')">Start</button>
                <button class="left" onclick="sendCommand('left')">Left</button>
                 <!--<button class="stop" onclick="sendCommand('stop')">Stop</button>-->
                <!--<button class="start" onclick="startRobot('start')">Start</button>-->
                <button class="right" onclick="sendCommand('right')">Right</button>
                <button class="backward" onclick="sendCommand('backward')">Backward</button>
            </div>
        </div>
        
        <div class="panel login-log">
            <h3>Login Log</h3>
            <ul>
                {% for log in logs %}
                    <li>{{ log }}</li>
                {% endfor %}
            </ul>
        </div>

        <div class="panel command-log">
            <h3>Command Log</h3>
            <ul>
                {% for log in command_logs %}
                    <li>{{ log.timestamp }} - Command: {{ log.command }} - Status: {{ log.status }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script>
        async function startRobot() {
    try {
        const response = await fetch('/start-robot', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ action: 'start' }), // Include the action in the body
        });

        if (!response.ok) {
            // Handle non-200 responses (e.g., 400, 415)
            const errorData = await response.json();
            alert(`Error: ${errorData.status}`);
            return;
        }

        const result = await response.json();
        alert(result.status);
    } catch (error) {
        console.error('Error starting the robot:', error);
        alert('An error occurred while starting the robot.');
    }
}


        async function sendCommand(action) {
            try {
                const response = await fetch('/send-command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: action })
                });
            
            } catch (error) {
                console.error('Error sending command:', error);
            }
        }
    </script>
</body>
</html>
